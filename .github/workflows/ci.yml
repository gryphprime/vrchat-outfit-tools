name: VPM package

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package
        run: scripts/validate-package.sh
      - name: Build VPM ZIP and checksum
        id: package
        shell: bash
        run: |
          archive=$(scripts/build-vpm-zip.sh dist)
          sha256sum "$archive" | tee "$archive.sha256"
          unzip -Z1 "$archive" | grep -qx package.json
          echo "name=$(basename "$archive" .zip)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
