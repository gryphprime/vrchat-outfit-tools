name: Publish VPM release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          version=$(scripts/validate-package.sh)
          [ "$GITHUB_REF_NAME" = "v$version" ] ||
            { echo "error: tag $GITHUB_REF_NAME must equal v$version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build VPM ZIP and checksum
        id: package
        shell: bash
        run: |
          archive=$(scripts/build-vpm-zip.sh dist)
          sha256sum "$archive" | tee "$archive.sha256"
          unzip -Z1 "$archive" | grep -qx package.json
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$archive" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.package.outputs.archive }}" "${{ steps.package.outputs.archive }}.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.archive }}" "${{ steps.package.outputs.archive }}.sha256" --title "$GITHUB_REF_NAME" --generate-notes
          fi
      - name: Persist VCC listing on main
        shell: bash
        run: |
          cp Packages/net.orpine.gryphprime.vrchat-outfit-tools/package.json "$RUNNER_TEMP/package.json"
          cp scripts/update-vpm-listing.py "$RUNNER_TEMP/update-vpm-listing.py"
          git fetch origin main
          git checkout -B main origin/main
          python3 "$RUNNER_TEMP/update-vpm-listing.py" docs/vpm/index.json "$RUNNER_TEMP/package.json" "${{ steps.package.outputs.sha256 }}"
          git add docs/vpm/index.json
          if git diff --cached --quiet; then
            echo "VCC listing already contains this release."
          else
            git config user.name gryphprime
            git config user.email gryphprime@users.noreply.github.com
            git commit -m "Publish VPM listing for v${{ steps.version.outputs.version }}"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/vpm
      - id: deployment
        uses: actions/deploy-pages@v4
